<!-- ============================================================ -->
<!--  CONTENT — Título + Texto + Imagem opcional               -->
<!--  Placeholders: {{TITULO_CONTENT}}, {{TEXTO_CONTENT}},     -->
<!--                {{IMAGEM_CONTENT_BLOCK}} (vazio = sem row)  -->
<!-- ============================================================ -->
<tr>
    <td style="padding: 8px 16px; background-color: #ffffff;">

        <!-- Título -->
        <h2 style="
            font-family: 'Hotmart Sans', sans-serif;
            font-size: 22px;
            font-weight: 700;
            line-height: 1.5;
            color: #0d0d0d;
            margin: 0 0 12px 0;
            padding: 0;
        ">
            {{TITULO_CONTENT}}
        </h2>

        <!-- Texto -->
        <p style="
            font-family: 'Hotmart Sans', sans-serif;
            font-size: 16px;
            font-weight: 400;
            line-height: 1.6;
            color: #0d0d0d;
            margin: 0;
            padding: 0;
        ">
            {{TEXTO_CONTENT}}
        </p>

    </td>
</tr>
{{IMAGEM_CONTENT_BLOCK}}
