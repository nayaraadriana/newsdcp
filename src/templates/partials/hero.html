<!-- ============================================================ -->
<!--  HERO — Imagem Destaque + Título + Texto                   -->
<!-- ============================================================ -->
<tr>
    <td style="padding: 16px 16px 16px 16px; background-color:#ffffff;">

        <!-- Imagem Hero (acima do conteúdo) -->
        {{IMAGEM_HERO_ABOVE}}

        <!-- Título Hero -->
        <h2 style="
            font-family: 'Hotmart Sans', sans-serif;
            font-size: 24px;
            font-weight: 700;
            line-height: 1.5;
            color: #0d0d0d;
            margin: 0 0 8px 0;
            padding: 0;
        ">
            {{TITULO_HERO}}
        </h2>

        <!-- Texto Hero -->
        <div style="
            font-family: 'Hotmart Sans', sans-serif;
            font-size: 16px;
            font-weight: 400;
            line-height: 1.6;
            color: #0d0d0d;
            margin: 0;
            padding: 0;
        ">
            {{TEXTO_HERO}}
        </div>

        <!-- Imagem Hero (abaixo do conteúdo) -->
        {{IMAGEM_HERO_BELOW}}

    </td>
</tr>
