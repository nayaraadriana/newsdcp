<!-- ============================================================ -->
<!--  HIGHLIGHT — Banner da seção + Item de destaque            -->
<!--  Placeholders: {{TITULO_HIGHLIGHT}}, {{TEXTO_HIGHLIGHT}}   -->
<!--  {{IMAGEM_HIGHLIGHT_ABOVE}} / {{IMAGEM_HIGHLIGHT_BELOW}}   -->
<!--  Variável: {{BG_COLOR}} — alterna entre #ffffff e #f5f3ef  -->
<!-- ============================================================ -->

<!-- Banner "Highlights" — incluído apenas no primeiro highlight -->
{{HIGHLIGHT_BANNER}}

<!-- Imagem opcional do Highlight (acima do conteúdo) -->
{{IMAGEM_HIGHLIGHT_ABOVE}}

<!-- Item do highlight -->
<tr>
    <td class="highlight-item" style="
        padding: 8px 16px;
        background-color: {{BG_COLOR}};
        border-bottom: 1px solid #2E2E2C;
    ">
        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
            <tr>
                <td style="padding-left: 0; padding-right: 0;">

                    <!-- Título do Highlight -->
                    <h3 style="
                        font-family: 'Hotmart Sans', sans-serif;
                        font-size: 24px;
                        font-weight: 700;
                        line-height: 1.5;
                        color: #ffffff;
                        margin: 0 0 16px 0;
                        padding: 0;
                    ">
                        {{TITULO_HIGHLIGHT}}
                    </h3>

                    <!-- Texto do Highlight -->
                    <div style="
                        font-family: 'Hotmart Sans', sans-serif;
                        font-size: 16px;
                        font-weight: 400;
                        line-height: 1.6;
                        color: #ffffff;
                        margin: 0;
                        padding: 0;
                    ">
                        {{TEXTO_HIGHLIGHT}}
                    </div>

                </td>
            </tr>
        </table>
    </td>
</tr>

<!-- Imagem opcional do Highlight (abaixo do conteúdo) -->
{{IMAGEM_HIGHLIGHT_BELOW}}
