<!--  FIQUE DE OLHO — Banner + Título + Texto                   -->
<!-- ============================================================ -->

<!-- Banner "Fique de Olho" -->
<tr>
    <td style="padding: 0; background-color:#eae9e7;">
        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
            <tr>
                <td align="center" style="
                    padding: 8px 8px;
                ">
                    <img src="https://newsletterdcp.s3.us-east-2.amazonaws.com/template-resources/fiqueDeolho.png"
                        alt="Fique de Olho" width="100%" style="
                        display: block;
                        border: 0;
                        max-width: 100%;
                        height: auto;
                    ">
                </td>
            </tr>
        </table>
    </td>
</tr>

<!-- Conteúdo do Fique de Olho -->
<tr>
    <td style="
        padding: 8px 16px 16px 16px;
        background-color: #eae9e7;
    ">
        <!-- Título -->
        <h3 style="
            font-family: 'Nunito Sans', sans-serif;
            font-size: 18px;
            font-weight: 700;
            line-height: 1.5;
            color: #0d0d0d;
            margin: 0 0 10px 0;
            padding: 0;
        ">
            {{TITULO_FIQUE_DE_OLHO}}
        </h3>

        <!-- Texto -->
        <p style="
            font-family: 'Hotmart Sans', sans-serif;
            font-size: 14px;
            font-weight: 400;
            line-height: 1.6;
            color: #0d0d0d;
            margin: 0;
            padding: 0;
        ">
            {{TEXTO_FIQUE_DE_OLHO}}
        </p>
    </td>
</tr>
